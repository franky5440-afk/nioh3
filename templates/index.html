<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仁王3 攻略武庫 | Nioh 3 Guide Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<section class="hero" id="hero">
  <div class="hero-wall" id="heroWall"></div>
  <div class="hero-img"  id="heroImg"></div>
  <div class="hero-halo" id="heroHalo"></div>
  <div class="hero-sweep"></div>
  <canvas class="hero-motes" id="heroMotes"></canvas>
  <div class="hero-scrim"></div>
  <div class="hero-vignette"></div>
  <div class="hero-fade"></div>

  <div class="hero-ui">
    <div class="hero-top">
      <span class="hero-wordmark">仁王三 攻略武庫</span>
      <span class="hero-chip">每日 08:00 自動更新</span>
    </div>

    <p class="hero-title" id="heroTitle">
      <span class="line"><span style="animation-delay:.55s">仁王 三</span></span>
      <span class="line"><span style="animation-delay:.70s">攻略武庫</span></span>
      <span class="line"><span style="animation-delay:.85s" class="hero-dim">— 全網彙整</span></span>
    </p>

    <div class="hero-foot">
      <p class="hero-lede">攻略・影片・討論・推文，每日自動彙整成一處。<br>
         中文 / English / 日本語 三區並行，不必再開十個分頁。</p>
      <a class="hero-cue" href="#tabs" aria-label="往下看內容">
        <span>探索武庫</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>
      </a>
    </div>
  </div>

  <figure class="hero-detail"><i></i></figure>
</section>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.4 7.2 16.9l.9-5.4L4.2 7.7l5.4-.8z"/></svg>
      <div class="brand-text">
        <h1>仁王<span>三</span>攻略武庫</h1>
        <p>NIOH 3 GUIDE HUB</p>
      </div>
    </div>
    <form class="search-box" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="搜尋攻略、影片、討論、推文…" autocomplete="off">
      <button type="submit" class="btn-gold">搜尋</button>
    </form>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="guides">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      攻略庫
    </button>
    <button class="tab" data-tab="hot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.4 0 8-3.6 8-8 0-4.9-3.6-8.5-5.7-10.5-.5-.5-1.3-.1-1.3.6C13 6.5 11 8 10 8c-.8 0-1-.7-1-1.5 0-.7-.8-1-1.3-.6C5.5 8 4 10.7 4 14c0 4.4 3.6 8 8 8z"/></svg>
      熱門影片 TOP10
    </button>
    <button class="tab" data-tab="new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      最新影片
    </button>
    <button class="tab" data-tab="bahamut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
      巴哈討論區
    </button>
    <button class="tab" data-tab="tweets">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      X 推文
    </button>
  </nav>
</header>

<main id="main">
  <section id="view-search" class="view hidden">
    <div class="view-head">
      <h2 id="searchTitle"></h2>
      <button class="btn-clear" id="clearSearch">✕ 清除搜尋</button>
    </div>
    <div id="searchResults"></div>
  </section>

  <section id="view-guides" class="view hidden">
    <div class="view-head">
      <h2>全網攻略庫</h2>
      <span class="meta-time" data-meta="guides"></span>
    </div>
    <div class="controls">
      <div class="pill-group" data-lang-for="guides">
        <button class="pill active" data-lang="zh">中文區</button>
        <button class="pill" data-lang="en">English</button>
        <button class="pill" data-lang="ja">日本語</button>
      </div>
      <div class="chip-row" id="guideChips"></div>
    </div>
    <div id="guideSections"></div>
  </section>

  <section id="view-hot" class="view hidden">
    <div class="view-head">
      <h2>熱門攻略影片 TOP 10</h2>
      <span class="meta-time" data-meta="videos_hot"></span>
    </div>
    <div class="controls">
      <div class="pill-group" data-lang-for="hot">
        <button class="pill active" data-lang="zh">中文區</button>
        <button class="pill" data-lang="en">English</button>
        <button class="pill" data-lang="ja">日本語</button>
      </div>
    </div>
    <div class="video-grid" id="hotGrid"></div>
  </section>

  <section id="view-new" class="view hidden">
    <div class="view-head">
      <h2>最新發布攻略影片</h2>
      <span class="meta-time" data-meta="videos_new"></span>
    </div>
    <div class="controls">
      <div class="pill-group" data-lang-for="new">
        <button class="pill active" data-lang="zh">中文區</button>
        <button class="pill" data-lang="en">English</button>
        <button class="pill" data-lang="ja">日本語</button>
      </div>
    </div>
    <div class="video-grid" id="newGrid"></div>
  </section>

  <section id="view-bahamut" class="view hidden">
    <div class="view-head">
      <h2>巴哈姆特 仁王哈啦區 — 最新討論</h2>
      <span class="meta-time" data-meta="bahamut"></span>
    </div>
    <div class="thread-list" id="bahaList"></div>
  </section>

  <section id="view-tweets" class="view hidden">
    <div class="view-head">
      <h2>X（Twitter）仁王3 相關推文</h2>
      <span class="meta-time" data-meta="tweets"></span>
    </div>
    <div class="controls">
      <div class="pill-group" data-lang-for="tweets">
        <button class="pill active" data-lang="zh">中文區</button>
        <button class="pill" data-lang="en">English</button>
        <button class="pill" data-lang="ja">日本語</button>
      </div>
    </div>
    <div class="tweet-list" id="tweetList"></div>
  </section>
</main>

<footer class="site-footer">
  <p>資料每日自動更新</p>
  <p id="lastRun"></p>
</footer>

<script src="static/hero.js"></script>
<script src="static/app.js"></script>
</body>
</html>
