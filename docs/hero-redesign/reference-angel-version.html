/* 2) 光暈：皇冠後方緩慢呼吸的暖光 */
.halo{
  position:absolute;left:50%;top:26%;width:46vmin;aspect-ratio:1;
  translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,196,.85) 0%,rgba(255,228,175,.25) 38%,transparent 68%);
  mix-blend-mode:screen;pointer-events:none;
  animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.09)}}

/* 3) 金色掃光 —— 斜向流過整個畫面，是「貴」的關鍵 */
.sweep{
  position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(105deg,transparent 42%,rgba(255,236,190,.9) 50%,transparent 58%);
  animation:sweep 9s linear infinite;
}
@keyframes sweep{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}

/* 4) 粒子 canvas：緩慢飄落的光塵 */
#motes{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}

/* 5) 暗角 + 顆粒，把 AI 圖壓成「印刷品」質感 */
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(80,64,50,.30) 100%);}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");}

/* ============ 介面層 ============ */
.ui{position:relative;z-index:5;min-height:100svh;padding:28px clamp(20px,4vw,56px);
    display:grid;grid-template-rows:auto 1fr auto;gap:24px}

/* 玻璃通用 */
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--glass-line);box-shadow:0 8px 30px rgba(90,72,55,.10)}

/* 頂列 */
.topbar{display:flex;align-items:center;gap:18px}
.back{width:46px;height:46px;border-radius:50%;background:#1B1714;color:#F1EAE3;
  display:grid;place-items:center;font-size:18px;flex:0 0 auto;
  transition:transform .5s var(--ease)}
.back:hover{transform:translateX(-4px)}
.wordmark{font-family:"Cormorant Garamond",serif;font-size:15px;letter-spacing:.34em;
  text-transform:uppercase;white-space:nowrap}
.nav{margin-inline:auto;display:flex;gap:6px;padding:6px;border-radius:999px}
.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
  color:var(--ink);padding:9px 16px;border-radius:999px;transition:background .35s,color .35s}
.nav a.is-on,.nav a:hover{background:rgba(255,255,255,.85)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(40,32,26,.35);background:transparent;font-size:15px;cursor:pointer;
  transition:background .4s,color .4s,transform .4s var(--ease)}
.iconbtn:hover{background:var(--ink);color:var(--ivory);transform:rotate(45deg)}
.pill{padding:12px 22px;border-radius:999px;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;cursor:pointer;white-space:nowrap}

/* 標題：逐行 mask reveal */
.headline{font-family:"Cormorant Garamond",serif;font-weight:400;
  font-size:clamp(30px,5.2vw,88px);line-height:.96;letter-spacing:.005em;
  text-transform:uppercase;width:fit-content;align-self:center}
.line{display:block;overflow:hidden;padding-right:.08em}
.line > span{display:block;transform:translateY(112%);
  animation:lineUp 1100ms var(--ease) forwards}
@keyframes lineUp{to{transform:translateY(0)}}
.dim{color:var(--ink-soft)}

/* 右側玻璃卡 */
.card{position:absolute;right:clamp(20px,10vw,140px);top:56%;max-width:330px;
  padding:26px 28px;border-radius:18px;opacity:0;transform:translateY(26px);
  animation:fadeUp 1100ms var(--ease) 1250ms forwards}
.card h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:26px;
  line-height:1.12;text-transform:uppercase;letter-spacing:.01em;margin-bottom:12px}
.card p{font-size:11.5px;line-height:1.75;color:var(--ink-soft)}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

/* 右下：同一張圖裁切成金色特寫小卡 */

  border:1px solid var(--glass-line);box-shadow:0 14px 40px rgba(90,72,55,.22);
  opacity:0;transform:translateY(26px);
  animation:fadeUp 1100ms var(--ease) 1450ms forwards}

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 滑鼠視差：多層不同深度，用 lerp 讓它有重量感 ---------- */
  const layers = [
    { el: document.getElementById('heroImg'), d: 14 },
    { el: document.getElementById('halo'),    d: 26 },
    { el: document.getElementById('headline'),d: -8 },
    { el: document.getElementById('card'),    d: -16 },
    { el: document.getElementById('detail'),  d: -22 },
  ].filter(l => l.el);

  let tx = 0, ty = 0, cx = 0, cy = 0, scrollT = 0, t0 = 0;
  const hero = document.getElementById('heroImg');

  if (!reduce) {
    addEventListener('pointermove', e => {
      tx = (e.clientX / innerWidth  - .5) * 2;   // -1 .. 1
      ty = (e.clientY / innerHeight - .5) * 2;
    }, { passive: true });

    addEventListener('scroll', () => {
      scrollT = Math.min(scrollY / innerHeight, 1);
    }, { passive: true });

    const easeOut = p => 1 - Math.pow(1 - p, 3);

    const tick = now => {
      if (!t0) t0 = now;
      // 進場：1.14 -> 1.00 的推近，跟 CSS 的 blur 淡入同時發生
      const intro = easeOut(Math.min((now - t0 - 100) / 1700, 1));
      const introScale = 1.14 - .14 * Math.max(intro, 0);

      cx += (tx - cx) * .055;                    // lerp = 慣性
      cy += (ty - cy) * .055;

      for (const { el, d } of layers) {
        const extra = el === hero
          ? ` scale(${introScale + scrollT * .12})`  // 捲動時繼續推近
          : ` translateY(${-scrollT * 90}px)`;       // 介面往上飄
        el.style.transform = `translate3d(${cx * d}px, ${cy * d}px, 0)` + extra;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  /* ---------- 光塵粒子 ---------- */
  const cv = document.getElementById('motes'), ctx = cv.getContext('2d');
  let motes = [], W = 0, H = 0;
  const resize = () => {
    const r = devicePixelRatio || 1;
    W = cv.width  = innerWidth  * r;
    H = cv.height = innerHeight * r;
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    const n = Math.round(innerWidth / 26);
    motes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() * 1.8 + .5) * r,
      vy: (Math.random() * .22 + .06) * r,
      vx: (Math.random() - .5) * .12 * r,
      a: Math.random() * .32 + .10,
      ph: Math.random() * Math.PI * 2,
    }));
  };
  resize(); addEventListener('resize', resize);

  if (!reduce) (function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.y += m.vy; m.x += m.vx + Math.sin(t / 1800 + m.ph) * .18;
      if (m.y > H + 8) { m.y = -8; m.x = Math.random() * W; }
      const tw = m.a * (.62 + .38 * Math.sin(t / 900 + m.ph));   // 閃爍
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,242,214,${tw})`;
      ctx.shadowBlur = 6; ctx.shadowColor = 'rgba(255,226,168,.9)';
      ctx.arc(m.x, m.y, m.r, 0, 6.284);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  })(0);
})();
</script>
</body>
